[general]
name = "SynapseAI"
version = "0.1.0"
log_level = "info"

[brain]
state_features = 8
state_bins = 10
learning_rate = 0.1
discount_factor = 0.95
initial_exploration = 1.0
exploration_decay = 0.995
min_exploration = 0.01

[memory]
db_path = "synapse_memory.db"
max_experiences = 100000

[simulation]
world_width = 20
world_height = 12
max_steps_per_episode = 200
randomize_on_reset = true

[consciousness]
emotion_learning_rate = 0.1
anomaly_threshold = 0.8
max_error_log = 1000
