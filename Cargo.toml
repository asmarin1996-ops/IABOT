[workspace]
resolver = "2"
members = [
    "synapse-core",
    "synapse-memory",
    "synapse-consciousness",
    "synapse-hal",
    "synapse-sim",
    "synapse-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SynapseAI"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
toml = "0.8"

[patch.crates-io]
piper-tts-rs-sys = { path = "vendor/piper-tts-rs-sys", version = "0.1.4" }
